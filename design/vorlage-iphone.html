 const next=`<section class="glass pane next-unit"><svg class="unit-art" viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--flow)" stroke-width="1" stroke-dasharray="2 6"/><circle cx="80" cy="80" r="44" fill="none" stroke="var(--signal)" stroke-width="1" opacity=".6"/><circle cx="80" cy="80" r="26" fill="none" stroke="var(--flow)" stroke-width="1" stroke-dasharray="10 5"><animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="40s" repeatCount="indefinite"/></circle></svg>
  <div class="row"><span class="eyebrow">Deine nächste Einheit</span></div><h2>${S.unit.length} Fragen, gemischt aus vier Themen</h2>
  <div class="row" style="gap:8px;flex-wrap:wrap"><span class="chip">${ic('clock')} ca. 25 Min.</span><span class="chip flow">${ic('learn')} ${S.read} von ${S.unit.length} gelesen</span></div>
  <div class="qlist">${u.slice(0,3).map(c=>`<div><span class="qid">${c.id}</span><span>${esc(c.title)}</span></div>`).join('')}<span class="more">und ${S.unit.length-3} weitere</span></div>
  ${btn('Einheit fortsetzen '+ic('arrow'),'primary'+(st.plat==='ios'?' block':''),'unit')}</section>`;
 const goal=`<section class="glass pane goalpane" style="display:grid;align-content:center">${gauge(S.doneToday,S.goal,'Tagesziel','Fragen heute · '+S.minutesDone+' von '+S.minutes+' Min.')}</section>`;
 const tiles=`<div class="grid g3">${[['shuffle','Kurztest','3 bekannte Fragen','flow','test'],['refresh','Wiederholen',S.pool.length+' offene Fragen','signal','learn'],['layers','Wissenstest','31 gelernte Fragen','check','test']].map(([i,t,s,c,g])=>`<button type="button" class="glass tile" data-go="${g}"><span class="ti" style="background:var(--${c}-soft);color:var(--${c})">${ic(i)}</span><b>${t}</b><span>${s}</span></button>`).join('')}</div>`;
 const topics=`<section class="glass pane stack"><div class="row between"><h3>Themen</h3><button type="button" class="link" data-go="pass">Lernpass ${ic('chev')}</button></div>${catProgress.map(t=>`<div class="topic">${catGlyph(t.c)}<div><b>${t.c}</b><div class="track"><i style="width:${t.pct}%"></i></div></div><span class="pct">${t.pct} %</span></div>`).join('')}</section>`;
 const date='Donnerstag, 5. November';
 if(st.plat==='win')return `<div class="screen">${head('Guten Abend',date+' · Tag '+S.day+' deines Lernplans',btn(ic('calendar')+' Lernplan','glassy','planner'))}<div class="grid g2" style="align-items:start"><div class="grid stagger">${next}${topics}</div><div class="grid stagger">${countdown}${goal}</div></div>${tiles}</div>`;
 return `<div class="screen">${head('Heute',date)}<div class="grid stagger">${next}${countdown}${tiles}${goal}${topics}</div></div>`}

function vLearn(){
 const steps=`<div class="steps">${[['1','Einheit lesen','Antworten verstehen',1],['2','Test schreiben','Selbst erklären',0],['3','Lücken wiederholen','Bis es sitzt',0]].map(([n,b,s,now])=>`<div class="step ${now?'now':''}"><span class="n">${n}</span><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
 const unit=`<section class="glass pane stack"><span class="eyebrow">Laufende Einheit · 4</span><h2>Mach dort weiter, wo du aufgehört hast.</h2><div class="read-dots">${S.unit.map((_,i)=>`<i class="${i<S.read?'on':i===S.read?'cur':''}"></i>`).join('')}</div><p class="small muted">${S.read} von ${S.unit.length} Fragen gelesen. Danach kannst du den Test starten.</p><div class="row" style="flex-wrap:wrap">${btn('Weiterlesen '+ic('arrow'),'primary','unit')}${btn('Test starten','glassy','test')}</div></section>`;
 const pool=`<section class="glass pane"><div class="row between"><div><span class="eyebrow">Wiederholen</span><h3 style="margin-top:3px">${S.pool.length} Fragen kommen wieder</h3></div><button type="button" class="link" data-go="test">Testen ${ic('chev')}</button></div><div class="list" style="margin-top:6px">${S.pool.map(([id,v])=>{const c=card(id),[l,cl]=verdict[v];return `<div class="li"><span class="qid">${id}</span><span class="t">${esc(c.title)}</span><span class="chip ${cl}">${l}</span></div>`}).join('')}</div></section>`;
 const more=`<div class="grid g3">${[['layers','Wissenstest','Alles Gelernte gemischt','check'],['image','Skizzenfragen','Bilder selbst erklären','flow'],['pen','Frei antworten','Ohne Zeitdruck üben','signal']].map(([i,t,s,c])=>`<button type="button" class="glass tile" data-go="test"><span class="ti" style="background:var(--${c}-soft);color:var(--${c})">${ic(i)}</span><b>${t}</b><span>${s}</span></button>`).join('')}</div>`;
 const analysis=`<section class="glass pane stack"><div class="row between"><h3>Lernanalyse</h3><span class="small faint">aus 6 Tests</span></div><div class="bars">${catProgress.map((t,i)=>{const v=[72,58,64,41,80][i];return `<div class="topic">${catGlyph(t.c)}<div><b>${t.c}</b><div class="track"><i style="width:${v}%;background:${v<50?'var(--warn)':'var(--ok)'}"></i></div></div><span class="pct">${v} %</span></div>`}).join('')}</div><p class="small faint">Anteil erfüllter Fachpunkte in deinen Tests. Keine Prognose der Prüfungsnote.</p></section>`;
 const mistakes=`<section class="glass pane stack"><div class="row between"><h3>Fehlerheft</h3><span class="chip warn">3 offen</span></div>${[['D8','Vakuum erzeugen','Ejektor-Prinzip fehlte: Druckluft strömt durch eine Düse und erzeugt dort den Unterdruck.'],['E2','Gleichrichter liefert zu wenig Spannung','Glättungskondensator nicht geprüft. Bei defektem Elko sinkt der Mittelwert der Ausgangsspannung.']].map(([id,t,p])=>`<div class="mistake"><div class="row"><span class="qid">${id}</span><b class="small">${t}</b></div><p>${p}</p></div>`).join('')}</section>`;
 if(st.plat==='win')return `<div class="screen">${head('Lernen','Erst verstehen, dann selbst erklären.')}<div class="grid stagger">${steps}<div class="grid g2">${unit}${pool}</div>${more}<div class="grid g2e">${analysis}${mistakes}</div></div></div>`;
 return `<div class="screen">${head('Lernen','Erst verstehen, dann selbst erklären.')}<div class="grid stagger">${steps}${unit}${pool}${more}${analysis}${mistakes}</div></div>`}

function readerBody(c){
 const parts=c.answer.map((a,i)=>{const text=st.mode==='short'?a.text.split(/(?<=\.)\s/)[0]:a.text;return `<div class="part"><span class="pn">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(a.label)}</h3><p>${esc(text)}</p></div></div>`}).join('');
 return `<div class="reader"><div class="row" style="flex-wrap:wrap"><span class="qid">${c.id}</span><span class="chip">${ic(c.category,'style="width:14px;height:14px"')} ${c.category}</span>${c.imagePage?`<span class="chip flow">${ic('image')} Mit Abbildung</span>`:''}</div><p class="question">${esc(c.question)}</p>
 <div class="seg big" role="group" aria-label="Erklärungstiefe"><button type="button" data-mode="short" aria-pressed="${st.mode==='short'}">Kurz</button><button type="button" data-mode="long" aria-pressed="${st.mode==='long'}">Ausführlich</button></div>
 <section class="glass pane">${parts}</section>
 <div class="memo">${ic('bolt')}<div><b>Merksatz</b><p>${esc(c.mnemonic)}</p></div></div>
 <div class="memo caution">${ic('warn')}<div><b>Darauf achten</b><p>${esc(c.pitfall)}</p></div></div>
 ${c.imagePage?`<a class="link" href="https://www.wko.at/ooe/bildung-lehre/fragenkatalog-kandidat-mec-h1.pdf#page=${c.imagePage}" target="_blank" rel="noopener">${ic('image')} Originalabbildung · Seite ${c.imagePage}</a>`:''}</div>`}
function vUnit(){const c=card(S.unit[st.reader]);
 const dock=`<div class="glass bottom-dock"><button type="button" class="iconbtn" data-reader="-1" aria-label="Vorherige Frage">${ic('back')}</button><div class="grow small faint" style="text-align:center">Frage ${st.reader+1} von ${S.unit.length}</div><button type="button" class="iconbtn" data-reader="1" aria-label="Nächste Frage">${ic('chev')}</button>${btn(ic('check')+' Gelesen','primary','', 'data-read="1"')}</div>`;
 return `<div class="screen push nohead">${st.plat==='win'?head('Einheit 4','Lies jede Frage mit ihrer Antwort. Den Test startest du danach.'):''}<div class="read-dots">${S.unit.map((_,i)=>`<i class="${i<st.reader?'on':i===st.reader?'cur':''}"></i>`).join('')}</div>${readerBody(c)}${st.plat==='win'?dock:''}</div>${st.plat==='ios'?'%%DOCK%%'+dock:''}`}

function vTest(){const ids=S.unit,c=card(ids[st.test]);
 const draft=st.test===2?'Ein Gleichrichter wandelt Wechselspannung in pulsierende Gleichspannung. Wenn die Ausgangsspannung zu niedrig ist, prüfe ich zuerst die Eingangsspannung am Trafo und dann die Dioden einzeln mit dem Multimeter im Diodentest. Eine defekte Diode halbiert bei der Brücke die Spannung …':'';
 return `<div class="screen push">${head('Test · Einheit 4','Antworte in eigenen Worten. Dein Entwurf wird laufend gespeichert.')}
 <div class="qnav" role="tablist" aria-label="Fragen im Test">${ids.map((id,i)=>`<button type="button" data-test="${i}" class="${i===st.test?'cur':i<2?'done':''}" aria-label="Frage ${i+1}">${i+1}</button>`).join('')}</div>
 <div class="row"><span class="qid">${c.id}</span><span class="chip">${c.category}</span><span class="small faint" style="margin-left:auto">Frage ${st.test+1} von ${ids.length}</span></div>
 <p class="question" style="font-family:var(--display);font-size:20px;font-weight:600;line-height:1.3">${esc(c.question)}</p>
 <div class="glass editor"><textarea id="answerDraft" aria-label="Deine Antwort" placeholder="Erkläre so, wie du es dem Prüfer sagen würdest …">${draft}</textarea><div class="ed-foot"><span class="dot" style="color:var(--ok)"></span>Entwurf gespeichert<span style="margin-left:auto" class="num">${draft.length} Zeichen</span></div></div>
 <div class="hidden-key">${ic('eyeoff')} Die Fachpunkte bleiben bis zur Abgabe verborgen.</div>
 <div class="row" style="flex-wrap:wrap">${btn('Nächste Frage '+ic('arrow'),'glassy','','data-test-next="1"')}${btn('Test abgeben','primary','result')}</div></div>`}

function vResult(){const rows=[['D22','correct'],['D30','correct'],['E2','wrong'],['E9','correct'],['E15','partial'],['E21','correct'],['E33','unclear'],['E40','partial']];
 const open=st.openResult;const t={correct:4,partial:2,wrong:1,unclear:1};
 const score=`<section class="glass pane score">${ring(64,'FACHPUNKTE',100,'var(--ok)')}<div style="display:grid;gap:8px;min-width:0"><h2>Gut erklärt, zwei Lücken bleiben.</h2><div class="tally"><span><i class="dot" style="color:var(--ok)"></i>${t.correct} richtig</span><span><i class="dot" style="color:var(--warn)"></i>${t.partial} teilweise</span><span><i class="dot" style="color:var(--err)"></i>${t.wrong} falsch</span><span><i class="dot" style="color:var(--check)"></i>${t.unclear} nachprüfen</span></div></div></section>`;
 const list=`<section class="glass pane"><div class="list verdict-list">${rows.map(([id,v])=>{const c=card(id),[l,cl,ii]=verdict[v];const isOpen=id===open;return `<div><div class="li" data-open="${id}" role="button" tabindex="0" aria-expanded="${isOpen}"><span class="qid">${id}</span><span class="t">${esc(c.title)}</span><span class="chip ${cl}">${ic(ii)} ${l}</span></div>${isOpen?`<div class="points stagger"><div class="pt ok">${ic('okc')}<span>Brückengleichrichter und Funktionsweise richtig beschrieben.</span></div><div class="pt miss">${ic('half')}<span>Glättungskondensator als typische Ursache fehlt.</span></div><div class="pt err">${ic('x')}<span>Eine defekte Brückendiode halbiert die Spannung nicht zwingend; meist entsteht Einweggleichrichtung mit höherer Welligkeit.</span></div><p class="feedback">Ergänze die Prüfung des Elkos und unterscheide Mittelwert und Welligkeit. Die Frage bleibt im Wiederholen, bis du sie in einem späteren Test vollständig richtig beantwortest.</p></div>`:''}</div>`}).join('')}</div></section>`;
 return `<div class="screen push">${head('Ergebnis','Test zu Einheit 4 · bewertet mit Gemini. Lernfeedback, keine offizielle Note.')}<div class="grid stagger" style="align-items:start;${st.plat==='win'?'grid-template-columns:1fr 1.5fr':''}">${score}${list}</div>${btn('Zurück zu Lernen','glassy'+(st.plat==='ios'?' block':''),'learn')}</div>`}

function vCatalog(){
 const list=INDEX.filter(q=>st.cat==='all'||q.category===st.cat);
 const seg=`<div class="seg big" role="group" aria-label="Ansicht"><button type="button" data-seg="cards" aria-pressed="${st.seg==='cards'}">Karten</button><button type="button" data-seg="list" aria-pressed="${st.seg==='list'}">Liste</button><button type="button" data-seg="own" aria-pressed="${st.seg==='own'}">Selbst ausfüllen</button></div>`;
 const chips=`<div class="chips">${[['all','Alle',INDEX.length],...CATS.map(c=>[c,c,INDEX.filter(q=>q.category===c).length])].map(([k,l,n])=>`<button type="button" data-cat="${k}" class="${st.cat===k?'on':''}">${k!=='all'?ic(k):''}${l} <span class="c">${n}</span></button>`).join('')}</div>`;
 const items=st.seg==='list'?`<section class="glass pane"><div class="list">${list.slice(0,24).map(q=>`<div class="li" data-detail="${q.id}" role="button" tabindex="0"><span class="qid">${q.id}</span><span class="t">${esc(q.title)}</span>${leds(stageOf(q.id))}${ic('chev','class="chev"')}</div>`).join('')}</div></section>`
 :`<div class="cgrid stagger">${list.slice(0,st.plat==='win'?18:12).map(q=>{const s=stageOf(q.id),fav=S.favorites.includes(q.id);const own=st.seg==='own'?(hash(q.id)%3===0?'<span class="chip ok">Ausgefüllt</span>':hash(q.id)%3===1?'<span class="chip warn">Begonnen</span>':'<span class="chip">Offen</span>'):'';return `<button type="button" class="glass qcard" data-detail="${q.id}"><div class="top"><span class="qid">${q.id}</span>${q.img?`<span class="chip flow" style="height:22px">${ic('image')} Skizze</span>`:''}<span class="star ${fav?'on':''}">${ic('star',fav?'fill="currentColor"':'')}</span></div><b>${esc(q.title)}</b><div class="meta">${ic(q.category,'style="width:14px;height:14px"')} ${q.category}${own||leds(s)}</div></button>`}).join('')}</div>`;
 return `<div class="screen">${head('Katalog','94 Fragen aus MEC H1, Kapitel D und E.',st.plat==='win'?btn(ic('download')+' Mit eigenen Antworten exportieren','glassy'):'')}<label class="glass search">${ic('search')}<input id="catSearch" type="search" placeholder="Begriff oder Nummer, z. B. Zahnriemen oder E15"></label>${seg}${chips}<div class="results-head"><span>${list.length} Fragen${st.cat!=='all'?' in '+st.cat:''}</span><span>${counts[5]} sicher erinnert</span></div>${items}</div>`}

function vPass(){
 const ladder=`<section class="glass pane stack"><div class="row between"><div><span class="eyebrow">Lernstufen</span><h2 style="margin-top:3px">${totalPct} % deines Wegs</h2></div>${ring(totalPct,'GESAMT',78,'var(--signal)')}</div><div class="ladder">${STAGES.map((n,i)=>`<div class="rung" style="--c:${STAGE_COLORS[i]}"><span class="rn">${i}</span><div><b>${n}</b><div class="rb"><i style="width:${Math.round(counts[i]/INDEX.length*100)}%"></i></div></div><span class="cnt">${counts[i]}</span></div>`).join('')}</div><p class="small faint">Stufe 5 erreicht eine Frage erst, wenn du sie an mehreren Tagen richtig erinnerst.</p></section>`;
 const start=new Date(2026,9,28);let cells='';const wd=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="wd">${d}</span>`).join('');
 for(let i=0;i<=S.examDays;i++){const d=new Date(start);d.setDate(start.getDate()+i);const dow=(d.getDay()+6)%7,learnDay=[0,1,3,5].includes(dow);let cls='d';
  if(i<S.day){cls+=learnDay?' l'+(1+hash(String(i))%3):' off'}else if(i===S.day){cls+=' today'}else if(i===S.examDays){cls+=' exam'}else if(i>=S.examDays-7){cls+=learnDay?' final':' off'}else if(!learnDay){cls+=' off'}
  cells+=`<span class="${cls}" title="${d.toLocaleDateString('de-AT',{day:'numeric',month:'long'})}">${d.getDate()}</span>`}
 const pad=Array((start.getDay()+6)%7).fill('<span></span>').join('');
 const cal=`<section class="glass pane stack"><div class="row between"><div><span class="eyebrow">Dein Weg bis ${S.exam}</span><h3 style="margin-top:3px">${S.streak} Lerntage in Folge</h3></div>${btn(ic('calendar')+' Plan','glassy','planner')}</div><div class="cal">${wd}${pad}${cells}</div><div class="legend"><span><i style="background:var(--flow)"></i>gelernt</span><span><i style="box-shadow:0 0 0 2px var(--signal) inset"></i>heute</span><span><i style="background:repeating-linear-gradient(135deg,var(--signal-soft) 0 3px,transparent 3px 6px);border:1px solid var(--signal-soft)"></i>Abschlussrunde</span><span><i style="background:var(--signal)"></i>Prüfung</span></div></section>`;
 const prof=`<section class="glass pane profile"><span class="eyebrow">So lernst du gerade</span><div style="margin-top:8px">${[['clock','Zeit pro Lerntag',S.minutes+' Min.'],['learn','Fragen pro Einheit',S.session],['calendar','Lerntage','Mo, Di, Do, Sa'],['bolt','Bevorzugt','Praxis, Struktur']].map(([i,l,v])=>`<div class="pl">${ic(i)}<span>${l}</span><b>${v}</b></div>`).join('')}</div></section>`;
 if(st.plat==='win')return `<div class="screen">${head('Lernpass','Prüfung am '+S.exam+' · Lernstart 28. Oktober')}<div class="grid g2e stagger" style="align-items:start">${ladder}<div class="grid">${cal}${prof}</div></div></div>`;
 return `<div class="screen">${head('Lernpass','Prüfung am '+S.exam)}<div class="grid stagger">${ladder}${cal}${prof}</div></div>`}

function vOnboarding(){const step=st.onb;let body='';
 if(step===0)body=`<span class="eyebrow">Schritt 1 von 3</span><h1 class="big-title">Wann ist deine Prüfung?</h1><p class="sub">Aus dem Termin entsteht dein Plan mit neuem Stoff, Wiederholungen und einer Abschlussrunde.</p><div class="onb hero-gauge">${gauge(35,60,'Tage bis zur Prüfung','Abschlussrunde: letzte 7 Lerntage')}</div><div class="field-row"><label for="examDate">Prüfungstermin</label><input id="examDate" class="glass inputish" type="date" value="2026-12-10"></div><button type="button" class="link" style="justify-self:start">Noch kein Termin? Mit 4 Wochen starten</button>`;
 if(step===1)body=`<span class="eyebrow">Schritt 2 von 3</span><h1 class="big-title">Wie viel Zeit hast du?</h1><p class="sub">Du kannst das jederzeit im Lernplan ändern.</p><div class="field-row"><label>Zeit pro Lerntag</label><div class="seg big" role="group">${[15,30,45,60,90].map(m=>`<button type="button" data-mins="${m}" aria-pressed="${st.mins===m}">${m}</button>`).join('')}</div></div><div class="field-row"><label>Lerntage</label><div class="wdays">${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<button type="button" data-wd="${i}" class="${st.days.includes(i)?'on':''}">${d}</button>`).join('')}</div></div><p class="small muted">${st.days.length} Lerntage à ${st.mins} Minuten reichen für alle 94 Fragen bis ${S.exam}.</p>`;
 if(step===2)body=`<span class="eyebrow">Schritt 3 von 3</span><h1 class="big-title">Was hilft dir beim Lernen?</h1><p class="sub">Wähle eine oder zwei Formen. Der Plan lernt danach aus deinen Antworten.</p><div class="fmt">${[['practice','Mechanik','Praxisbeispiele','Begriffe mit einem Beispiel aus dem Betrieb verstehen.'],['structure','layers','Klare Struktur','Zusammenhänge geordnet sehen, mit Skizzen.'],['speak','talk','Laut erklären','Antworten in eigenen Worten formulieren.'],['compact','bolt','Kurz und knapp','Merksätze zuerst, Details bei Bedarf.']].map(([k,i,b,s])=>`<button type="button" data-fmt="${k}" class="${st.fmts.includes(k)?'on':''}">${ic(i)}<span><b>${b}</b><span>${s}</span></span></button>`).join('')}</div>`;
 return `<div class="screen push nohead"><div class="onb ${st.plat==='win'?'onb-wrap':''}"><div class="onb dots">${[0,1,2].map(i=>`<i class="${i===step?'on':''}"></i>`).join('')}</div>${body}<div class="row">${step?btn('Zurück','plain','','data-onb="-1"'):''}${btn(step<2?'Weiter '+ic('arrow'):'Plan erstellen','primary'+(st.plat==='ios'?' block':''),'','data-onb="1" style="flex:1"')}</div></div></div>`}

/* ---------------- Sheets ---------------- */
function sheet(title,body,{left='',right=''}={}){return `<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="grab"></div><div class="sheet-head">${left||'<span style="width:38px"></span>'}<h2>${title}</h2>${right||`<button type="button" class="iconbtn glass" data-close="1" aria-label="Schließen">${ic('close')}</button>`}</div><div class="sheet-body">${body}</div></div>`}
function sDetail(){const c=card(st.detail);
 if(c.stub)return sheet(c.title,`<div class="reader"><div class="row"><span class="qid">${c.id}</span><span class="chip">${c.category}</span></div><p class="question">${esc(c.title)}</p><div class="hidden-key">${ic('info')} In der App stehen hier Frage, Teilantworten, Merksatz und Quellen aus deinen Lerninhalten.</div></div>`);
 return sheet(c.title,readerBody(c)+`<div class="row" style="flex-wrap:wrap">${btn(ic('pen')+' Selbst ausfüllen','glassy')}${btn('Diese Frage lernen '+ic('arrow'),'primary','unit')}</div>`)}
function sPlanner(){const days=[['Fr',3,2],['Sa',4,3],['Mo',3,4],['Di',2,4],['Do',3,3],['Sa',2,5],['Mo',2,4]];
 return sheet('Lernplan',`<div class="field-row"><label for="pExam">Prüfungstermin</label><input id="pExam" class="glass inputish" type="date" value="2026-12-10"></div><div class="field-row"><label>Zeit pro Lerntag</label><div class="seg big" role="group">${[15,30,45,60,90].map(m=>`<button type="button" data-mins="${m}" aria-pressed="${st.mins===m}">${m} Min.</button>`).join('')}</div></div><div class="field-row"><label>Lerntage</label><div class="wdays">${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<button type="button" data-wd="${i}" class="${st.days.includes(i)?'on':''}">${d}</button>`).join('')}</div></div>
 <section class="glass pane"><div class="row between"><h3>Nächste 7 Lerntage</h3><div class="legend"><span><i style="background:var(--signal)"></i>neu</span><span><i style="background:var(--flow)"></i>wiederholen</span></div></div><div class="plan-bars">${days.map(([d,n,r])=>`<div class="pb"><i style="height:${n*11}px;background:var(--signal)"></i><i style="height:${r*11}px;background:var(--flow)"></i><span>${d}</span></div>`).join('')}</div></section>
 <div class="memo">${ic('info')}<div><b>Passt</b><p>Alle 63 offenen Fragen bekommen bis 2. Dezember eine erste Bewertung. Ab 3. Dezember läuft die Abschlussrunde.</p></div></div>`,{left:`<button type="button" class="link" data-close="1">Abbrechen</button>`,right:`<button type="button" class="link" data-close="1" data-toast="Lernplan übernommen">Fertig</button>`})}
function sSettings(){const ios=st.plat==='ios';
 const g=(items)=>`<div class="glass group">${items.map(([icn,col,lab,small,val,act])=>`<div class="gi" ${act?`data-go="${act}" role="button" tabindex="0" style="cursor:pointer"`:''}><span class="ic" style="background:${col}">${ic(icn)}</span><span class="lab">${lab}${small?`<small>${small}</small>`:''}</span><span class="val">${val||''}${act?ic('chev'):''}</span></div>`).join('')}</div>`;
 return sheet('Einstellungen',`
 <span class="glabel">GERÄTE & ABGLEICH</span>${g([['sync','var(--ok)','Synchronisiert','Zuletzt vor 2 Minuten','',''],[ios?'pc':'phone','var(--flow)',ios?'Windows-PC':'iPhone','Gekoppelt seit 28. Oktober','Aktiv',''],['link','var(--check)','Gerät koppeln','Mit Code oder QR-Code','','pair']])}
 <span class="glabel">KI-BEWERTUNG</span>${g([['cpu','var(--ok)','Gemini verbunden','gemini-3.1-flash-lite · eigener Schlüssel','',''],['key','var(--ink-3)','Schlüssel verwalten','Wird verschlüsselt auf deinem Server gespeichert','','']])}
 <span class="glabel">LERNEN</span>${g([['calendar','var(--signal)','Lernplan',S.exam+' · '+S.minutes+' Min.','','planner'],['layers','var(--flow)','Erklärungstiefe','','Kurz',''],['moon','var(--ink-3)','Darstellung','','System','']])}
 <span class="glabel">SICHERUNG</span>${g([['download','var(--flow)','Lernstand exportieren','JSON-Datei mit allen Antworten','',''],['upload','var(--flow)','Lernstand importieren','','',''],['refresh','var(--ink-3)','Frühere Stände','3 Serverstände, 2 Gerätestände','','conflict']])}
 <span class="glabel">APP</span>${ios?g([['download','var(--signal)','Version 1.7.0','Updates kommen über SideStore','Aktuell',''],['refresh','var(--ink-3)','In SideStore öffnen','App-Signatur läuft in 5 Tagen ab','','']]):g([['download','var(--signal)','Update 1.7.1 bereit','Wird beim nächsten Start installiert','','update'],['refresh','var(--ink-3)','Automatisch aktualisieren','Prüft GitHub-Releases beim Start','<span class="switch on" role="switch" aria-checked="true"></span>','']])}
 <p class="small faint" style="text-align:center">Eigene Lernhilfen · kein offizieller Lösungsschlüssel<br>Quelle: WKO-Fragenkatalog MEC H1, 02/2024</p>`)}
function sPair(){const ios=st.plat==='ios';return sheet('Gerät koppeln',`<p class="sub" style="text-align:center">${ios?'Öffne am PC Einstellungen › Gerät koppeln und gib diesen Code ein.':'Scanne den Code mit dem iPhone oder gib die Zahlen dort ein.'}</p>${ios?'':`<div class="qr">${qr()}</div>`}<div class="pair-code">${'418 092'.replace(' ','').split('').map(n=>`<span class="glass">${n}</span>`).join('')}</div><p class="small faint" style="text-align:center">Gültig für 10 Minuten. Danach teilen beide Geräte denselben Lernstand.</p><div class="row" style="justify-content:center">${btn('Neuen Code erzeugen','glassy')}</div>`)}
function qr(){let s='<svg viewBox="0 0 25 25" width="126" height="126" shape-rendering="crispEdges">';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);let on;if(f){const lx=x>17?x-18:x,ly=y>17?y-18:y;on=lx===0||ly===0||lx===6||ly===6||(lx>1&&lx<5&&ly>1&&ly<5)}else on=hash(x+'.'+y)%2===0;if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#13202b"/>`}return s+'</svg>'}
function sConflict(){const ios=st.plat==='ios';const a=ios?'Dieses iPhone':'Dieser PC',b=ios?'Windows-PC':'iPhone';
 const side=(k,name,when,rows)=>`<button type="button" class="side ${st.pickConflict===k?'on':''}" data-pick="${k}"><span class="row">${ic(k==='here'?(ios?'phone':'pc'):(ios?'pc':'phone'),'style="width:18px;height:18px"')}<b class="small">${name}</b></span><span class="small faint">${when}</span><dl>${rows.map(([t,v,m])=>`<dt>${t}</dt><dd class="${m?'more':''}">${v}</dd>`).join('')}</dl></button>`;
 return sheet('Abgleich nötig',`<p class="sub">Auf beiden Geräten wurde gelernt. Wähle den Stand, mit dem du weitermachst. Den anderen kannst du vorher sichern.</p><div class="diff">${side('here',a,'Heute, 17:42',[['Tests','8',1],['Bewertet','41',1],['Notizen','12'],['Eigene Antworten','19']])}${side('there',b,'Heute, 16:05',[['Tests','7'],['Bewertet','38'],['Notizen','14',1],['Eigene Antworten','19']])}</div><div class="row" style="flex-wrap:wrap">${btn(ic('download')+' Anderen Stand sichern','glassy')}${btn((st.pickConflict==='here'?a:b)+' übernehmen','primary','','data-close="1" data-toast="Lernstand abgeglichen"')}</div>`)}
function sUpdate(){return sheet('Update 1.7.1',`<div class="row"><span class="chip signal">${ic('download')} 18,4 MB</span><span class="small faint">Veröffentlicht heute auf GitHub</span></div><ul class="changes"><li>Lernplan zeigt die Abschlussrunde im Kalender.</li><li>Kurztest merkt sich die letzte Frage.</li><li>Abgleich mit dem iPhone startet schneller.</li></ul><div class="memo">${ic('info')}<div><b>Dein Lernstand bleibt</b><p>Das Update ersetzt nur das Programm. Antworten und Fortschritt liegen getrennt davon.</p></div></div><div class="row" style="justify-content:flex-end;flex-wrap:wrap">${btn('Später','plain','','data-close="1"')}${btn(ic('refresh')+' Jetzt neu starten','primary','','data-close="1" data-toast="Update installiert · Version 1.7.1"')}</div>`)}

/* ---------------- Gerüste ---------------- */
const tabs=[['today','today','Heute'],['learn','learn','Lernen'],['catalog','catalog','Katalog'],['pass','pass','Lernpass']];
function screenHTML(){if(st.push==='unit')return vUnit();if(st.push==='test')return vTest();if(st.push==='result')return vResult();if(st.push==='onboarding')return vOnboarding();return {today:vToday,learn:vLearn,catalog:vCatalog,pass:vPass}[st.tab]()}
function sheetHTML(){return st.sheet?{detail:sDetail,planner:sPlanner,settings:sSettings,pair:sPair,conflict:sConflict,update:sUpdate}[st.sheet]():''}
function toastHTML(){return st.toast?`<div class="toast glass" role="status">${ic('okc')} ${st.toast}</div>`:''}
const bg='<div class="field" aria-hidden="true"><i></i><i></i><i></i></div><div class="gridpaper" aria-hidden="true"></div>';
function iosShell(){let html=screenHTML(),dock='';if(html.includes('%%DOCK%%')){[html,dock]=html.split('%%DOCK%%')}
 const title={unit:'Einheit 4',test:'Test',result:'Ergebnis',onboarding:'Einrichtung'}[st.push]||tabs.find(t=>t[0]===st.tab)[2];
 const back=st.push?`<button type="button" class="nav-back glass" data-go="${st.push==='onboarding'?'settings':'learn'}">${ic('back','style="width:20px;height:20px"')} ${st.push==='onboarding'?'Abbrechen':'Lernen'}</button>`:'';
 const actions=st.push?'':`<div class="nav-actions"><button type="button" class="iconbtn glass" data-go="settings" aria-label="Einstellungen">${ic('settings')}</button></div>`;
 const tabbar=st.push?'':`<nav class="tabbar glass" aria-label="Bereiche"><span class="blob" id="tabBlob"></span>${tabs.map(([k,i,l])=>`<button type="button" data-go="${k}" class="${st.tab===k?'on':''}" ${st.tab===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span>${k==='learn'?`<span class="badge">${S.pool.length}</span>`:''}</button>`).join('')}</nav>`;
 return `<div class="device phone ios" id="device">${bg}<div class="statusbar"><span class="num">18:09</span><span class="sb-r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg></span></div><div class="island"></div>
 <div class="app"><header class="navbar" id="navbar">${back}<span class="nav-title">${title}</span>${actions}</header><div class="scroller" id="scroller">${html}</div>${dock}${tabbar}</div>${sheetHTML()}${toastHTML()}<div class="homebar"></div></div>`}
function winShell(){const html=screenHTML();const crumb={unit:'Lernen › Einheit 4',test:'Lernen › Test',result:'Lernen › Ergebnis',onboarding:'Einrichtung'}[st.push];
 return `<div class="device win" id="device">${bg}<div class="titlebar"><svg width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#e57c1f"/><path d="M32 34 L43 23" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="34" r="5" fill="#fff"/></svg><span class="tb-name">Lernpass</span><button type="button" class="update-pill" data-go="update">${ic('download')} Update 1.7.1 bereit</button><div class="caps"><span><svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor"/></svg></span><span><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></span><span><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor"/></svg></span></div></div>
 <div class="app"><aside class="sidebar glass"><div class="brand"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="url(#lg)"/><circle cx="32" cy="34" r="17" fill="none" stroke="#fff" stroke-width="3.2" stroke-dasharray="3 4.2" opacity=".85"/><path d="M32 34 L43 23" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="34" r="4" fill="#fff"/></svg><div><b>Lernpass</b><small>Mechatronik · MEC H1</small></div></div>
 <nav class="nav" aria-label="Bereiche"><span class="blob" id="navBlob"></span>${tabs.map(([k,i,l])=>`<button type="button" data-go="${k}" class="${st.tab===k&&st.push!=='onboarding'?'on':''}">${ic(i)}<span>${l}</span>${k==='learn'?`<span class="count">${S.pool.length}</span>`:''}</button>`).join('')}</nav>
 <div class="side-plan"><span class="eyebrow">Prüfung · ${S.exam}</span><strong class="num">Tag ${S.day} <span>/ ${S.examDays}</span></strong><div class="track"><i style="width:${Math.round(S.day/S.examDays*100)}%;background:linear-gradient(90deg,var(--flow),var(--signal))"></i></div><button type="button" class="link" data-go="planner">Lernplan anpassen ${ic('chev')}</button></div>
 <div class="nav" style="margin-top:8px"><button type="button" data-go="settings">${ic('settings')}<span>Einstellungen</span></button></div></aside>
 <div class="main"><div class="toolbar"><span class="crumb">${crumb?crumb.replace(/(.*) › (.*)/,'$1 › <b>$2</b>'):'<b>'+tabs.find(t=>t[0]===st.tab)[2]+'</b>'}</span><div class="tools"><span class="status-pill glass"><i class="dot pulse"></i>Synchronisiert</span><span class="status-pill glass"><i class="dot"></i>Gemini</span><span class="status-pill glass" style="color:var(--signal)">${ic('bolt','style="width:15px;height:15px"')} ${S.streak} Tage</span></div></div><div class="scroller" id="scroller">${html}</div></div></div>${sheetHTML()}${toastHTML()}</div>`}

/* ---------------- Rendern ---------------- */
function render(){
 const sc=document.getElementById('scaler');sc.innerHTML=st.plat==='ios'?iosShell():winShell();
 placeBlob();fit();chips();
 document.querySelectorAll('#platformSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.plat===st.plat));
 const scroller=document.getElementById('scroller'),nav=document.getElementById('navbar');
 if(scroller&&nav){const on=()=>nav.classList.toggle('compact',scroller.scrollTop>36);scroller.addEventListener('scroll',on,{passive:true});on()}
 if(st.toast){const t=st.toast;setTimeout(()=>{if(st.toast===t){st.toast=null;const el=document.querySelector('.toast');el&&el.remove()}},2700)}}
function placeBlob(){const b=document.getElementById('tabBlob');if(b){const on=b.parentElement.querySelector('button.on');if(on){b.style.left=on.offsetLeft+'px';b.style.width=on.offsetWidth+'px'}}
 const n=document.getElementById('navBlob');if(n){const on=n.parentElement.querySelector('button.on');if(on){n.style.top=on.offsetTop+'px';n.style.height=on.offsetHeight+'px';n.style.opacity=1}else n.style.opacity=0}}
function fit(){const sc=document.getElementById('scaler'),dev=document.getElementById('device');if(!dev)return;const w=st.plat==='ios'?393+24:1180,h=st.plat==='ios'?852+24:760;const avail=document.getElementById('stage').clientWidth;const s=Math.min(1,avail/w);sc.style.transform=`scale(${s})`;sc.style.width=w+'px';sc.style.height=h+'px';sc.parentElement.style.height=(h*s)+'px';sc.style.padding=st.plat==='ios'?'12px':'0';if(s<1)sc.style.marginRight=-(w-w*s)+'px';else sc.style.marginRight='0'}
function chips(){const cur=current();document.getElementById('screenChips').innerHTML=SCREENS.map(([k,l])=>`<button type="button" role="tab" data-go="${k}" class="${k===cur?'on':''}" aria-selected="${k===cur}">${l}</button>`).join('')}

document.addEventListener('click',e=>{const t=e.target.closest('button,[data-go],[data-detail],[data-open],[data-close]');if(!t)return;
 if(t.dataset.plat){st.plat=t.dataset.plat;render();return}
 if(t.dataset.theme){const v=t.dataset.theme;if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b===t));try{localStorage.setItem('lp-theme',v)}catch(_){};return}
 if(t.dataset.toast){st.sheet=null;st.toast=t.dataset.toast;render();return}
 if(t.dataset.close){st.sheet=null;render();return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.detail){st.detail=t.dataset.detail;st.sheet='detail';render();return}
 if(t.dataset.open){st.openResult=st.openResult===t.dataset.open?null:t.dataset.open;render();return}
 if(t.dataset.mode){st.mode=t.dataset.mode;render();return}
 if(t.dataset.reader){st.reader=Math.max(0,Math.min(S.unit.length-1,st.reader+ +t.dataset.reader));render();return}
 if(t.dataset.read){if(st.reader<S.unit.length-1){st.reader++;st.toast='Als gelesen markiert'}else st.push='test';render();return}
 if(t.dataset.test){st.test=+t.dataset.test;render();return}
 if(t.dataset.testNext){st.test=(st.test+1)%S.unit.length;render();return}
 if(t.dataset.cat){st.cat=t.dataset.cat;render();return}
 if(t.dataset.seg){st.seg=t.dataset.seg;render();return}
 if(t.dataset.onb){const n=st.onb+ +t.dataset.onb;if(n>2){st.onb=0;st.push=null;st.tab='today';st.toast='Dein Lernplan steht'}else st.onb=Math.max(0,n);render();return}
 if(t.dataset.mins){st.mins=+t.dataset.mins;render();return}
 if(t.dataset.wd){const d=+t.dataset.wd;st.days=st.days.includes(d)?st.days.filter(x=>x!==d):[...st.days,d].sort();render();return}
 if(t.dataset.fmt){const f=t.dataset.fmt;st.fmts=st.fmts.includes(f)?st.fmts.filter(x=>x!==f):[...st.fmts,f].slice(-2);render();return}
 if(t.dataset.pick){st.pickConflict=t.dataset.pick;render();return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&st.sheet){st.sheet=null;render()}});
document.addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');g.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')},{passive:true});
window.addEventListener('resize',fit);
(function(){let th='system';try{th=localStorage.getItem('lp-theme')||'system'}catch(_){}if(th!=='system')document.documentElement.setAttribute('data-theme',th);document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===th));
 if(LOCK){document.getElementById('platformSeg').hidden=true}
 const h=location.hash.slice(1);if(SCREENS.some(s=>s[0]===h))go(h);else render()})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SCREENS.some(s=>s[0]===h))go(h)});
</script>

</body>
</html>
