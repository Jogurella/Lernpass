<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Lernpass · iPhone-Vorlage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Vorschau-Bühne mit Gerät (iPhone 393×852 / Windows-Fenster 1180×760); innen dieselben Bildschirme, Liquid-Glass-Ebenen über einem ruhigen Lichtfeld mit Millimeterraster. */
:root{
  --ink:#13202b; --ink-2:#4a5866; --ink-3:#7f8b97;
  --paper:#e6ecf1; --stage:#d9e1e8;
  --glass:rgba(255,255,255,.50); --glass-strong:rgba(255,255,255,.74); --glass-thin:rgba(255,255,255,.30);
  --glass-edge:rgba(255,255,255,.88); --glass-low:rgba(255,255,255,.22); --glass-shadow:rgba(28,48,72,.14);
  --hair:rgba(19,32,43,.09); --hair-2:rgba(19,32,43,.05); --grid:rgba(31,96,120,.06);
  --signal:#dd7419; --signal-soft:rgba(221,116,25,.14); --on-signal:#fff;
  --flow:#1b8aa1; --flow-soft:rgba(27,138,161,.13);
  --ok:#1f8c5a; --ok-soft:rgba(31,140,90,.13); --warn:#b97a10; --warn-soft:rgba(201,131,22,.15);
  --err:#c9443b; --err-soft:rgba(201,68,59,.12); --check:#5f63c8; --check-soft:rgba(95,99,200,.13);
  --field-a:#8fd0dc; --field-b:#f6c690; --field-c:#bcc5f0;
  --s0:#a9b4be; --s1:#8fb8c6; --s2:#5fa9bd; --s3:#2f97ae; --s4:#2a9a7b; --s5:#1f8c5a;
  --bezel:#1b2026; --titlebar:rgba(255,255,255,.42);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Cascadia Code",Consolas,monospace;
  --spring:cubic-bezier(.32,1.42,.56,1); --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eaf0f4; --ink-2:#a9b6c1; --ink-3:#77848f; --paper:#0a1117; --stage:#060b10;
  --glass:rgba(28,40,52,.48); --glass-strong:rgba(34,48,62,.76); --glass-thin:rgba(30,44,58,.30);
  --glass-edge:rgba(255,255,255,.16); --glass-low:rgba(255,255,255,.05); --glass-shadow:rgba(0,0,0,.5);
  --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.05); --grid:rgba(120,200,220,.05);
  --signal:#f0913a; --signal-soft:rgba(240,145,58,.17); --on-signal:#1a0f04;
  --flow:#45b8cf; --flow-soft:rgba(69,184,207,.15);
  --ok:#3fbf86; --ok-soft:rgba(63,191,134,.15); --warn:#e3a73f; --warn-soft:rgba(227,167,63,.15);
  --err:#ef6a5f; --err-soft:rgba(239,106,95,.15); --check:#9a9df0; --check-soft:rgba(154,157,240,.16);
  --field-a:#0f4b57; --field-b:#5c3510; --field-c:#252c66;
  --s0:#47535e; --s1:#3c6876; --s2:#3a8396; --s3:#3ba0b6; --s4:#35ae8a; --s5:#3fbf86;
  --bezel:#2a3038; --titlebar:rgba(20,30,40,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#eaf0f4; --ink-2:#a9b6c1; --ink-3:#77848f; --paper:#0a1117; --stage:#060b10;
  --glass:rgba(28,40,52,.48); --glass-strong:rgba(34,48,62,.76); --glass-thin:rgba(30,44,58,.30);
  --glass-edge:rgba(255,255,255,.16); --glass-low:rgba(255,255,255,.05); --glass-shadow:rgba(0,0,0,.5);
  --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.05); --grid:rgba(120,200,220,.05);
  --signal:#f0913a; --signal-soft:rgba(240,145,58,.17); --on-signal:#1a0f04;
  --flow:#45b8cf; --flow-soft:rgba(69,184,207,.15);
  --ok:#3fbf86; --ok-soft:rgba(63,191,134,.15); --warn:#e3a73f; --warn-soft:rgba(227,167,63,.15);
  --err:#ef6a5f; --err-soft:rgba(239,106,95,.15); --check:#9a9df0; --check-soft:rgba(154,157,240,.16);
  --field-a:#0f4b57; --field-b:#5c3510; --field-c:#252c66;
  --s0:#47535e; --s1:#3c6876; --s2:#3a8396; --s3:#3ba0b6; --s4:#35ae8a; --s5:#3fbf86;
  --bezel:#2a3038; --titlebar:rgba(20,30,40,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--flow);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- Vorschau-Leiste (nur Vorlage) ---------- */
.studio{max-width:1240px;margin:0 auto;padding-top:18px;display:grid;gap:14px}
.studio-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.studio-name{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.studio-name b{font-family:var(--display);font-size:17px;letter-spacing:-.01em}
.studio-name span{font-size:12.5px;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--glass-low);border:1px solid var(--hair);position:relative}
.seg button{position:relative;z-index:1;padding:6px 12px;border-radius:9px;font-size:13px;color:var(--ink-2);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--glass-strong);box-shadow:0 1px 2px var(--glass-shadow),inset 0 1px 0 var(--glass-edge)}
.screen-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.screen-chips button{flex:none;font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-2);background:var(--glass-thin);transition:all .2s}
.screen-chips button:hover{color:var(--ink);border-color:var(--ink-3)}
.screen-chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sample-note{font-size:12px;color:var(--ink-3)}
.stage{display:flex;justify-content:center;min-width:0}
.scaler{transform-origin:top left}

/* ---------- Geräte ---------- */
.device{position:relative;overflow:hidden;background:var(--paper);isolation:isolate}
.phone{width:393px;height:852px;border-radius:56px;box-shadow:0 0 0 11px var(--bezel),0 0 0 12px rgba(255,255,255,.08),0 40px 90px -20px rgba(10,20,30,.45)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60}
.statusbar{position:absolute;inset:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 42px;font-size:16px;font-weight:600;z-index:55;pointer-events:none}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:var(--ink);opacity:.85;z-index:60}
.win{width:1180px;height:760px;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 30px 80px -20px rgba(10,20,30,.45)}

/* Lichtfeld + Raster */
.field{position:absolute;inset:-10%;z-index:-2;filter:blur(60px) saturate(1.1)}
.field i{position:absolute;border-radius:50%;opacity:.95;animation:drift 26s var(--ease) infinite alternate}
.field i:nth-child(1){width:60%;height:45%;left:-8%;top:-6%;background:var(--field-a)}
.field i:nth-child(2){width:55%;height:40%;right:-10%;top:24%;background:var(--field-b);animation-duration:32s;animation-delay:-8s}
.field i:nth-child(3){width:70%;height:42%;left:10%;bottom:-12%;background:var(--field-c);animation-duration:38s;animation-delay:-14s}
@keyframes drift{to{transform:translate(6%,8%) scale(1.12)}}
.gridpaper{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;mask-image:linear-gradient(180deg,#000,transparent 75%)}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:linear-gradient(160deg,var(--glass-strong),var(--glass) 42%,var(--glass-thin));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 var(--glass-low),0 10px 30px -12px var(--glass-shadow),0 1px 2px var(--glass-shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,30%) var(--my,-20%),var(--glass-edge),transparent 60%);opacity:.35;mix-blend-mode:soft-light;transition:opacity .3s}
.glass:hover::after{opacity:.6}
.pane{border-radius:24px;padding:18px}
.win .pane{border-radius:16px;padding:18px 20px}

/* ---------- Grundtypo ---------- */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
.big-title{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.win .big-title{font-size:28px;font-weight:600}
.sub{color:var(--ink-2);font-size:15px;line-height:1.45;margin:4px 0 0}
.win .sub{font-size:14px}
h2{font-size:20px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
h3{font-size:16px;font-weight:600;letter-spacing:-.005em}
p{margin:0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:13px;line-height:1.4}

/* ---------- Steuerelemente ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15.5px;transition:transform .35s var(--spring),box-shadow .25s,background .25s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--signal) 88%,#fff),var(--signal));color:var(--on-signal);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -8px var(--signal)}
.btn.primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px -8px var(--signal)}
.btn.glassy{background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),0 4px 14px -8px var(--glass-shadow)}
.btn.plain{background:var(--hair-2);color:var(--ink)}
.btn.block{width:100%}
.win .btn{height:36px;border-radius:9px;font-size:14px;padding:0 16px}
.link{color:var(--flow);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:15px;height:15px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.glass{border-radius:50%}
.win .iconbtn{width:34px;height:34px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--hair-2);color:var(--ink-2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.signal{background:var(--signal-soft);color:var(--signal)}
.chip.flow{background:var(--flow-soft);color:var(--flow)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.check{background:var(--check-soft);color:var(--check)}
.qid{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 7px;border-radius:7px;border:1px solid var(--hair);background:var(--glass-low);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.track{height:6px;border-radius:6px;background:var(--hair);overflow:hidden}
.track i{display:block;height:100%;border-radius:inherit;background:var(--flow);transform-origin:left;animation:grow 1.1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.cat-glyph{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--glass-edge);color:var(--flow);flex:none}
.cat-glyph svg{width:19px;height:19px}

/* Stufen-LEDs */
.leds{display:inline-flex;gap:3px}
.leds i{width:12px;height:5px;border-radius:3px;background:var(--hair)}
.leds i.on{background:var(--c)}

/* ---------- App-Gerüst iOS ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.ios .scroller{flex:1;overflow-y:auto;overflow-x:hidden;padding:58px 16px 120px;scrollbar-width:none}
.ios .scroller::-webkit-scrollbar{display:none}
.ios .navbar{position:absolute;inset:0 0 auto;height:96px;padding:52px 16px 0;display:flex;align-items:center;justify-content:space-between;z-index:40;pointer-events:none}
.ios .navbar>*{pointer-events:auto}
.ios .navbar .nav-title{position:absolute;left:0;right:0;top:60px;text-align:center;font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:.3s var(--ease);pointer-events:none}
.ios .navbar::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--glass-strong),var(--glass));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid var(--hair);opacity:0;transition:opacity .3s}
.ios .navbar.compact::before{opacity:1}
.ios .navbar.compact .nav-title{opacity:1;transform:none}
.ios .nav-actions{margin-left:auto;display:flex;gap:8px;position:relative}
.ios .nav-back{position:relative;display:flex;align-items:center;gap:2px;color:var(--flow);font-size:17px;font-weight:500;height:38px;padding:0 12px 0 6px;border-radius:999px}
.ios .head{padding:44px 4px 18px;display:grid;gap:4px}
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:999px;display:flex;align-items:center;padding:5px;z-index:45}
.tabbar .blob{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-edge),0 2px 10px -4px var(--glass-shadow);transition:left .55s var(--spring),width .55s var(--spring)}
.tabbar button{position:relative;z-index:1;flex:1;height:100%;display:grid;place-items:center;align-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink-2);transition:color .3s}
.tabbar button svg{width:24px;height:24px;transition:transform .45s var(--spring)}
.tabbar button.on{color:var(--signal)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--signal);color:var(--on-signal);font-size:10.5px;display:grid;place-items:center}

/* ---------- App-Gerüst Windows ---------- */
.win .app{flex-direction:row}
.titlebar{position:absolute;inset:0 0 auto;height:40px;display:flex;align-items:center;z-index:50;padding-left:14px;gap:10px;font-size:12.5px}
.titlebar .tb-name{color:var(--ink-2)}
.titlebar .caps{margin-left:auto;display:flex;height:100%}
.titlebar .caps span{width:46px;display:grid;place-items:center;color:var(--ink-2)}
.titlebar .caps span:hover{background:var(--hair)}
.titlebar .caps span:last-child:hover{background:#c42b1c;color:#fff}
.titlebar .caps svg{width:11px;height:11px}
.update-pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:7px;background:var(--signal-soft);color:var(--signal);font-weight:600;font-size:12px;margin-left:12px;animation:slidein .7s var(--spring) both .6s}
.update-pill svg{width:14px;height:14px}
@keyframes slidein{from{transform:translateY(-8px);opacity:.3}}
.sidebar{width:248px;flex:none;margin:48px 0 10px 10px;border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{font-family:var(--display);font-size:16px;font-weight:650;letter-spacing:-.01em;display:block}
.brand small{font-size:11.5px;color:var(--ink-3)}
.nav{position:relative;display:grid;gap:2px}
.nav .blob{position:absolute;left:0;right:0;border-radius:9px;background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-edge),0 2px 8px -4px var(--glass-shadow);transition:top .5s var(--spring)}
.nav .blob::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--signal)}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;font-size:14px;color:var(--ink-2);text-align:left;transition:color .25s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);font-weight:600}
.nav button svg{width:19px;height:19px}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--signal);color:var(--on-signal);padding:1px 7px;border-radius:9px}
.side-plan{margin-top:auto;padding:14px;border-radius:12px;background:var(--glass-low);border:1px solid var(--hair);display:grid;gap:8px}
.side-plan strong{font-size:22px;font-family:var(--display);font-weight:650}
.side-plan strong span{font-size:14px;color:var(--ink-3);font-weight:500}
.win .main{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:40px}
.toolbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 24px 0 22px}
.toolbar .crumb{font-size:13px;color:var(--ink-3)}
.toolbar .crumb b{color:var(--ink);font-weight:600}
.toolbar .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.win .scroller{flex:1;overflow-y:auto;padding:4px 24px 28px 22px;scrollbar-width:thin}
.win .head{display:flex;align-items:flex-end;gap:16px;padding:6px 0 18px}
.win .head>div{flex:1;min-width:0}
.status-pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.status-pill .dot{color:var(--ok)}
.status-pill.warn .dot{color:var(--warn)}

/* ---------- Bildschirme ---------- */
.screen{display:grid;gap:14px;animation:enter .55s var(--ease) both}
.screen.push{animation-name:pushin}
@keyframes enter{from{opacity:.25;transform:translateY(10px)}}
@keyframes pushin{from{opacity:.3;transform:translateX(26px)}}
.stagger>*{animation:rise .6s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:.3;transform:translateY(12px) scale(.985)}}
.grid{display:grid;gap:14px}
.grid>*,.screen>*{min-width:0}
.win .screen>.btn{justify-self:start}
.ios .screen.nohead{padding-top:46px}
.sheet-head h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .sheet-head>span:first-child{display:none}
.win .goalpane .gauge{width:220px;height:152px}
.win .g2{grid-template-columns:1.35fr 1fr}
.win .g3{grid-template-columns:repeat(3,1fr)}
.win .g2e{grid-template-columns:1fr 1fr}
.win .span2{grid-column:span 2}
.ios .g3{grid-template-columns:repeat(3,1fr);gap:10px}

/* Heute */
.countdown{display:grid;gap:12px}
.countdown .days{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.countdown .days small{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.timeline{position:relative;height:28px}
.timeline .rail{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:4px;background:var(--hair)}
.timeline .done{position:absolute;left:0;top:12px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--flow),var(--signal));animation:grow 1.2s var(--ease) both}
.timeline .final{position:absolute;right:0;top:10px;height:8px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--signal-soft) 0 4px,transparent 4px 8px);border:1px solid var(--signal-soft)}

<script>
const CARDS=[{"id":"D1","title":"Greifprinzip und Greiferauswahl","category":"Pneumatik","question":"Ordne Greifer nach ihrem Wirkprinzip, erläutere zwei Backenbauformen und begründe drei Kriterien für die Auswahl an einem Werkstück.","answer":[{"label":"Wirkprinzipien","text":"Eine sinnvolle Einteilung unterscheidet mechanische Greifer und haftende Greifer. Mechanische Greifer halten mit Fingern durch Reibung (Kraftschluss) oder durch passende Konturen (Formschluss). Zu haftenden Systemen gehören Vakuumgreifer und Magnetgreifer; Magnete setzen einen geeigneten ferromagnetischen Werkstoff voraus."},{"label":"Zwei Bauformen","text":"Beim Parallelgreifer bewegen sich die Backen geradlinig aufeinander zu. Das eignet sich für definierte Außen- und Innengriffe. Beim Winkelgreifer schwenken die Finger; der größere Öffnungsraum kann das Freigeben eines Werkstücks erleichtern. Pneumatisch oder elektrisch beschreibt dagegen die Antriebsart."},{"label":"Drei Auswahlkriterien","text":"Erstens zählen Masse, Schwerpunkt, Geometrie und Oberfläche des Werkstücks. Zweitens müssen Haltekraft und Fingerbelastung auch bei Beschleunigung, Bremsen und ungünstiger Reibung ausreichen. Drittens müssen Hub, Zugänglichkeit, Wiederholgenauigkeit und Umgebungsbedingungen zur Aufgabe passen; empfindliche Teile dürfen dabei nicht verformt werden."}],"mnemonic":"Erst Werkstück und Bewegung beurteilen, dann Greifprinzip, Kraft und Baugröße wählen.","pitfall":"Die statische Gewichtskraft allein genügt nicht zur Greiferauslegung; Beschleunigung und Reibung verändern die erforderliche Haltekraft.","imagePage":null,"pdfPage":2},{"id":"D3","title":"Geführte und kolbenstangenlose Antriebe","category":"Pneumatik","question":"Welche Vorteile bringt eine zusätzliche Zylinderführung, was kennzeichnet einen kolbenstangenlosen Antrieb und wie unterscheiden sich dessen zwei gängige Kopplungsprinzipien?","answer":[{"label":"Nutzen einer Führung","text":"Eine passende Führung nimmt Querkräfte und Kippmomente auf und verhindert das Verdrehen des Schlittens. Das entlastet Kolbenstange und Dichtungen und verbessert die reproduzierbare Ausrichtung des Werkzeugs. Ein gewöhnlicher Kolbenstangenzylinder ist hauptsächlich für axiale Kräfte vorgesehen."},{"label":"Ohne ausfahrende Kolbenstange","text":"Bei einem kolbenstangenlosen Zylinder fährt ein außenliegender Schlitten entlang des Zylindergehäuses. Der innere Kolben treibt ihn an. Der Bauraum wächst dadurch weniger stark mit dem Hub als bei einem Zylinder mit ausfahrender Stange."},{"label":"Zwei Kopplungen","text":"Bei mechanischer Kopplung verbindet ein Mitnehmer den Kolben durch einen längs verlaufenden Gehäuseschlitz mit dem Schlitten; Dichtbänder verschließen den Schlitz. Bei magnetischer Kopplung übertragen Magnete die Bewegung durch ein geschlossenes Zylinderrohr. Diese Kopplung besitzt eine begrenzte übertragbare Kraft und kann bei Überlast entkoppeln."}],"mnemonic":"Die Führung trägt Querlasten; die Kopplung überträgt die Kolbenbewegung.","pitfall":"Kolbenstangenlos bedeutet weder unbegrenzt belastbar noch selbsttätig gegen Absinken gesichert.","imagePage":25,"pdfPage":3},{"id":"D8","title":"Vakuum erzeugen","category":"Pneumatik","question":"Nenne verschiedene technische Vakuumerzeuger und erkläre den Luftweg sowie die Unterdruckentstehung in einem Druckluftejektor.","answer":[{"label":"Erzeugerarten","text":"Gängige Möglichkeiten sind mechanisch angetriebene Vakuumpumpen, beispielsweise Drehschieberpumpen, Vakuumgebläse für größere Volumenströme und druckluftbetriebene Ejektoren. Die Auswahl hängt von benötigtem Unterdruck, Saugvermögen, Leckage und Betriebsdauer ab."},{"label":"Ejektorprinzip","text":"Druckluft strömt durch eine verengte Treibdüse und wird stark beschleunigt. Der schnelle Luftstrahl reißt Gas aus dem angeschlossenen Saugraum mit; dort sinkt der Druck unter den Umgebungsdruck. Im nachfolgenden Misch- und Auslassbereich werden Treibluft und angesaugte Luft gemeinsam abgeführt, meist über einen Schalldämpfer. Es gibt keine mechanisch bewegte Pumpe im Ejektor."},{"label":"Wirkung am Sauger","text":"Die Haltekraft entsteht durch die Druckdifferenz zwischen Umgebung und Saugerinnerem über der wirksamen Fläche. Ein Vakuum ist kein eigener „Sogstoff“; Undichtheiten und poröse Oberflächen erfordern entsprechend mehr Saugvermögen."}],"mnemonic":"Der Ejektor verbraucht Druckluft, um Luft aus dem Saugraum mitzunehmen.","pitfall":"Ein hoher maximaler Unterdruck und ein großes Saugvermögen sind unterschiedliche Auswahlgrößen.","imagePage":26,"pdfPage":5},{"id":"D12","title":"Spannzylinder und sichere Positionsabfrage","category":"Pneumatik","question":"Nenne zwei fluidtechnische Spannprinzipien, erläutere die Gefahr eines blockierten Schwenkspanners und vergleiche Möglichkeiten zur Positionsüberwachung.","answer":[{"label":"Zwei Spannprinzipien","text":"Ein linearer Druck- oder Zugspanner bewegt sein Spannelement geradlinig. Ein Schwenkspanner schwenkt zunächst das Spanneisen über das Werkstück und führt danach den eigentlichen Spannhub aus. Beide Prinzipien lassen sich je nach Bauart pneumatisch oder hydraulisch verwirklichen."},{"label":"Blockierung","text":"Ein verklemmter Schwenkspanner kann unter Druck und mechanischer Spannung stehen. Beim Freigeben ist deshalb eine plötzliche Bewegung möglich. Die Prüfungserklärung lautet: Werkstück und bewegliche Teile sichern, Energiezustand einschließlich Restenergie nach Betriebsanleitung durch befugtes Personal sichern und die Ursache untersuchen lassen. Mehr Druck oder gewaltsames Lösen ersetzt keine Diagnose."},{"label":"Positionsabfrage","text":"Möglich sind magnetische Zylindersensoren, induktive Näherungsschalter an einer Schaltstange, mechanische Endschalter oder eine pneumatische Staudruck- beziehungsweise Differenzdruckabfrage. Ein Wegmesssystem liefert einen kontinuierlichen Positionswert. Reiner Versorgungsdruck ist kein verlässlicher Positionsnachweis: Druck kann auch bei blockiertem Spanner anstehen."}],"mnemonic":"Druck vorhanden heißt nicht Werkstück richtig gespannt.","pitfall":"Eine Endlagenmeldung allein beweist nur die erfasste Stellung, nicht automatisch eine ausreichende Spannkraft oder korrekte Werkstücklage.","imagePage":null,"pdfPage":7},{"id":"D17","title":"Drei Arten der Bewegungsübertragung","category":"Mechanik","question":"Vergleiche Riemen-, Ketten- und Zahnradtrieb nach Wirkprinzip und Achsabstand und gib für jeden ein Anwendungsbeispiel.","answer":[{"label":"Riemenantrieb","text":"Ein biegsamer Riemen verbindet Riemenscheiben und überbrückt einen größeren Achsabstand. Flach- und Keilriemen übertragen durch Reibung und können schlupfen. Zahnriemen übertragen durch Zahneingriff formschlüssig. Beispiel: ein Keilriemen am Lüfter oder ein Zahnriemen an einer Positionierachse."},{"label":"Kettenantrieb","text":"Eine Gelenkkette greift formschlüssig in Kettenräder ein, etwa an einem Förderer oder Fahrrad. Es gibt keinen Reibschlupf wie beim Keilriemen. Gelenkverschleiß verändert jedoch die Teilung; außerdem können Geräusch und ungleichförmiger Lauf durch den Polygoneffekt entstehen. Schmierung und Wartung sind bauartabhängig."},{"label":"Zahnradantrieb","text":"Die Zähne der Räder greifen unmittelbar ineinander. Das eignet sich für kompakte, belastbare Übersetzungen, zum Beispiel im Getriebe einer Werkzeugmaschine. Der Abstand wird durch die Radgeometrie festgelegt; Schmierung und genaue Lagerung sind wichtig. Kette und Riemen können dagegen größere Abstände ohne Zwischenrad überbrücken."}],"mnemonic":"Riemen läuft über Scheiben, Kette greift in Räder, Zahnräder greifen direkt ineinander.","pitfall":"Die Aussage „Riemen haben immer Schlupf“ stimmt für korrekt ausgelegte Zahnriemen nicht.","imagePage":null,"pdfPage":10},{"id":"D22","title":"Keilriemen und Zahnriemen","category":"Mechanik","question":"Wozu wird ein Riementrieb eingesetzt und wie erkennst und erklärst du Keilriemen und Zahnriemen?","answer":[{"label":"Zweck","text":"Ein Riementrieb überträgt Leistung zwischen Wellen über einen umlaufenden Riemen. Unterschiedliche wirksame Scheibendurchmesser beziehungsweise Zähnezahlen ergeben eine Übersetzung. Die flexible Verbindung überbrückt größere Achsabstände und kann je nach Bauart Schwingungen mindern."},{"label":"Keilriemen","text":"Sein Querschnitt ist trapezförmig und läuft in einer passenden Rille. Die Kraft wird über Reibung an den Flanken übertragen; dazu ist eine geeignete Vorspannung nötig. Schlupf ist möglich. Eine gezahnte Innenseite bei manchen Keilriemen verbessert die Biegsamkeit, macht sie aber nicht zu Zahnriemen."},{"label":"Zahnriemen","text":"Seine Zähne greifen in passende Zahnlücken der Riemenscheibe ein. Das ergibt eine formschlüssige, im normalen Betrieb schlupffreie Übertragung mit fester Zuordnung der Drehwinkel. Zahnprofil, Teilung, Breite und zulässige Last müssen zueinander passen."}],"mnemonic":"Keilriemen hält an den Flanken durch Reibung; Zahnriemen greift mit seinen Zähnen.","pitfall":"Sichtbare Querkerben an einem Keilriemen sind keine formschlüssig eingreifenden Zahnriemenzähne.","imagePage":37,"pdfPage":12},{"id":"D30","title":"Installationskanäle auswählen","category":"Elektrotechnik","question":"Du planst eine übersichtliche Leitungsführung. Vergleiche Kanalbauformen, Vorteile und Werkstoffe und erläutere die Schutzmaßnahme für leitfähige Kanalsysteme.","answer":[{"label":"Bauformen","text":"Leitungsführungskanal für die Wand, Brüstungs- beziehungsweise Geräteeinbaukanal, Sockelleistenkanal, Bodenkanal und Verdrahtungskanal im Schaltschrank sind Beispiele. Bauform und Einbauort müssen zusammenpassen."},{"label":"Vorteile","text":"Geordnete Leitungsführung mit mechanischem Schutz, leichterer Zugang bei Erweiterung und Wartung sowie Trennung unterschiedlicher Stromkreise durch geeignete Kammern oder Trennstege. Füllgrad, Wärmeabfuhr und Biegeradien bleiben zu berücksichtigen."},{"label":"Werkstoffe","text":"Kunststoffe, etwa PVC oder halogenfreie Ausführungen, sowie Stahlblech oder Aluminium. Auswahl nach mechanischer Belastung, Brandanforderungen, Korrosion und Umgebung."},{"label":"Metallkanäle","text":"Die Elektrofachkraft beurteilt und realisiert die erforderliche Schutzleiter- beziehungsweise Potentialausgleichseinbindung nach Systemzulassung und Norm. Elektrische Durchgängigkeit von Verbindern, Deckeln und Trennstegen sicherstellen und prüfen; eine lackierte Schraubverbindung genügt nicht automatisch. Den Kanal nicht ohne Zulassung als Schutzleiter verwenden."}],"mnemonic":"Ordnung, Schutz und Zugang brauchen auch Platz und Erdungskonzept.","pitfall":"Eine Metallabdeckung ist nicht allein durch Aufsetzen sicher elektrisch verbunden. Herstellerangaben zur Kontaktierung beachten.","imagePage":null,"pdfPage":16},{"id":"E2","title":"Gleichrichter liefert zu wenig Spannung","category":"Elektrotechnik","question":"Bei einem Brückengleichrichter fällt der gemessene Gleichanteil deutlich ab. Erkläre einen möglichen Diodenfehler, eine fachgerechte Diodenprüfung und den Begriff Kommunikationsprotokoll.","answer":[{"label":"Plausible Ursache","text":"Eine unterbrochene Diode kann einen der beiden Strompfade der Brücke sperren. Statt beider Halbwellen wird nur noch eine genutzt. Ohne Glättung und bei vergleichbarer Last kann der Gleichspannungsmittelwert ungefähr halbiert sein; die Pulsfrequenz sinkt von 2f auf f. Mit Siebkondensator ist die genaue Spannung last- und kapazitätsabhängig. Das Symptom allein beweist diesen Fehler nicht."},{"label":"Diodenprüfung","text":"Nur an sicher spannungsfreiem, fachgerecht entladenem Gerät prüfen; bei netzverbundenen Geräten durch Elektrofachkräfte. Parallele Schaltungspfade nötigenfalls durch fachgerechtes Trennen eines Anschlusses ausschließen. Im Diodentest zeigt eine normale Si-Diode in Durchlassrichtung typisch etwa 0,5–0,8 V und in Sperrrichtung OL. Sehr klein in beiden Richtungen spricht für Kurzschluss, OL in beiden für Unterbrechung."},{"label":"Protokoll","text":"Vereinbarte Regeln für den Datenaustausch: zum Beispiel Nachrichtenaufbau, Adressierung, Bedeutung der Daten, zeitlicher Ablauf und Fehlererkennung. Teilnehmer benötigen zueinander passende Protokolle; ein passender Stecker genügt nicht."}],"mnemonic":"Fehlt eine Halbwelle, fehlt ein Strompfad.","pitfall":"Halbe Ausgangsspannung bedeutet nicht immer genau eine defekte Diode. Glättung, Last, Versorgung und Messart beeinflussen den Wert.","imagePage":null,"pdfPage":42},{"id":"E9","title":"Österreichische Normen richtig zuordnen","category":"Sicherheit","question":"Ordne die historischen Verweise E 8001 und E 8701 sowie die Maschinen-Norm 60204-1 fachlich ein. Berücksichtige den Normenstand vom 5. November 2026, drei Auswahlkriterien und vier Bestandteile einer fachgerechten Abnahme.","answer":[{"label":"Niederspannungsanlagen","text":"ÖVE/ÖNORM E 8001 steht für frühere österreichische Errichtungsbestimmungen elektrischer Niederspannungsanlagen. Für aktuelle Planung ist insbesondere OVE E 8101 relevant; der OVE führt die Neufassung 2025-10-01. Bei Altanlagen sind Errichtungszeitpunkt, Änderungen und die einschlägige rechtliche Lage gesondert zu beurteilen."},{"label":"Elektrische Geräte","text":"ÖVE/ÖNORM E 8701 betrifft Prüfungen nach Instandsetzung beziehungsweise Änderung und wiederkehrende Geräteprüfungen. Sie ist teilweise durch OVE EN 50678 für Prüfungen nach Reparatur und OVE EN 50699 für Wiederholungsprüfungen ersetzt. Ein vollständiger pauschaler Wegfall wäre falsch: OVE-Fachinformation G02 nennt beispielsweise Geräte unter 25 V AC beziehungsweise 60 V DC sowie bestimmte Reparaturprüfungen an Audio-/Video-/IT-Geräten. Produktbezogene Sondernormen können vorrangig sein."},{"label":"Maschinen","text":"Richtig lautet die Nummer OVE EN 60204-1: elektrische Ausrüstung von Maschinen, allgemeine Anforderungen. Die Angabe EN 602014-1 ist ein Schreibfehler. Austrian Standards führt aktuell die Ausgabe 2026-08-01. Eine Maschine und die versorgende Gebäudeinstallation haben unterschiedliche, sich ergänzende Regelungsbereiche."},{"label":"Drei Auswahlkriterien","text":"1. Geltungsbereich und Anlagen-/Produktart. 2. Aktuelle Ausgabe, Änderungen und Übergangsregelungen. 3. Österreichischer Rechts-, Vertrags- und Anwendungsbezug; Normenstatus und gesetzliche Verbindlichkeit getrennt prüfen."},{"label":"Vier Abnahmepunkte","text":"1. Vollständige Dokumentation, Pläne, Betriebsanleitung und erforderliche Konformitätsunterlagen. 2. Besichtigung von Aufbau, Kennzeichnung, Auswahl und Schutzmaßnahmen. 3. Erforderliche elektrische Messungen durch qualifiziertes Prüfpersonal mit dokumentierten Ergebnissen. 4. Geschütztes Erproben von Funktion und Sicherheitsfunktionen einschließlich Wiederanlaufverhalten sowie dokumentierte Freigabe."}],"mnemonic":"Anlage: 8101. Gerät: passende Prüf-Norm. Maschine: 60204-1.","pitfall":"Nicht ungeprüft alte Normnummern auswendig anwenden. E 8701 ist nur teilweise ersetzt; technische Nachfolgenorm und gesetzlicher Verweis sind nicht dasselbe.","imagePage":null,"pdfPage":46},{"id":"E15","title":"Widerstände auslegen und einstellen","category":"Elektrotechnik","question":"Welche Daten brauchst du zur Auswahl eines Widerstands? Zeige einen Wert außerhalb einer gewählten E-Reihe durch Zusammenschaltung, berechne die Belastung und erkläre Aufbau sowie Funktion eines Potentiometers.","answer":[{"label":"Auswahlwerte","text":"Nennwiderstand und Toleranz, zulässige Dauer- und Impulsleistung, maximale Betriebsspannung, Temperaturkoeffizient, Umgebung und Bauform. Nennwerte werden häufig aus E-Reihen gewählt, zum Beispiel E12, E24 oder E96. Leistungsangaben gelten unter definierten Temperaturbedingungen."},{"label":"Zwischenwert bilden","text":"In Reihe addieren sich Widerstände: Rges = R1 + R2. Beispiel aus E12-Werten: 1 kΩ + 220 Ω = 1,22 kΩ. Parallel gilt 1/Rges = 1/R1 + 1/R2; bei zwei Widerständen Rges = R1 × R2 / (R1 + R2). Alternativ passende feinere Normreihe oder einen geeigneten Abgleich verwenden. Toleranzen mitberücksichtigen."},{"label":"Leistung","text":"Im jeweiligen Widerstand P = U × I = I² × R = U²/R berechnen. Beispiel: 10 V an 1 kΩ ergeben 0,1 W. Einen Typ mit ausreichender Reserve unter Beachtung von Datenblatt und Temperatur-Derating wählen. Spannungs- und Impulsgrenzen gelten zusätzlich, auch wenn die mittlere Leistung klein bleibt."},{"label":"Potentiometer","text":"Widerstandsbahn mit zwei Endanschlüssen und beweglichem Schleifer mit drittem Anschluss. Als Spannungsteiler liefert er eine einstellbare Teilspannung; als veränderlicher Widerstand werden Schleifer und ein Ende genutzt, sofern der Typ dafür geeignet ist. Lineare oder logarithmische Kennlinie nach Anwendung wählen; Schleiferstrom und Teilbahnleistung begrenzen."}],"mnemonic":"Ohm legt die Funktion fest, Watt und Volt die Belastungsgrenzen.","pitfall":"Ein Potentiometer verträgt nicht auf jedem kleinen Teilstück seine gesamte Nennleistung. Für Präzisionsweggeber gelten besondere Vorgaben zur Schleiferbelastung.","imagePage":null,"pdfPage":49},{"id":"E21","title":"Robotereinsatz und klare Programmstruktur","category":"Automation","question":"Bewerten Sie einen Robotereinsatz mit je drei Chancen und Grenzen. Wie wird ein Automatisierungsprogramm verständlich gegliedert, und wie hilft ein wiederverwendbarer Baustein dabei?","answer":[{"label":"Drei Vorteile","text":"Roboter können wiederholte Bewegungen mit hoher Wiederholgenauigkeit ausführen, gleichmäßige Abläufe und planbare Taktzeiten unterstützen und Menschen von schweren, monotonen oder gefährlichen Tätigkeiten entlasten. Durch Umprogrammierung und Werkzeugwechsel sind sie für unterschiedliche Aufgaben einsetzbar."},{"label":"Drei Nachteile oder Aufwände","text":"Anschaffung und Integration kosten Geld; Greifer, Vorrichtungen und Schutzkonzept gehören dazu. Programmierung, Einrichten und Instandhaltung benötigen qualifiziertes Personal. Bei wechselnden oder unzureichend beherrschten Prozessbedingungen entstehen zusätzlicher Sensorik- und Anpassungsaufwand sowie Stillstandsrisiken."},{"label":"Drei Strukturierungsmöglichkeiten","text":"Erstens nach Anlagenfunktionen in überschaubare Module gliedern, etwa Zuführen, Spannen und Bearbeiten. Zweitens wiederkehrende Funktionen in parametrierbare Bausteine mit klaren Schnittstellen auslagern. Drittens Ablaufzustände mit einer nachvollziehbaren Schrittkette oder Zustandsmaschine organisieren. Einheitliche Namen und aussagekräftige Kommentare unterstützen alle drei."},{"label":"Bausteinbeispiel","text":"Ein Baustein für einen Förderantrieb erhält Start, Stop und Rückmeldungen als Eingänge und liefert Ansteuerung, Betriebszustand und Störung zurück. Jede Antriebsinstanz erhält ihren eigenen Zustandsspeicher. So kann derselbe geprüfte Ablauf mehrfach genutzt werden, während eine Änderung an einer klar abgegrenzten Stelle erfolgt."}],"mnemonic":"Eine Funktion, eine klare Schnittstelle, ein eigener Zustand.","pitfall":"Wiederholgenauigkeit mit absoluter Positioniergenauigkeit oder Robotereinsatz mit automatisch sicherem Betrieb gleichsetzen.","imagePage":null,"pdfPage":52},{"id":"E33","title":"Maschinen bewegen und Kranberechtigung einordnen","category":"Sicherheit","question":"Welche maschinellen und manuellen Transportmittel kommen für Werkzeugmaschinen infrage, welche Voraussetzungen gelten in Österreich für das Kranführen, welche Anschlagmittel kennen Sie und was ist vor dem Anlagentransport zu planen?","answer":[{"label":"Transportmöglichkeiten","text":"Maschinell sind beispielsweise Hallenkran und geeigneter Gabelstapler einsetzbar. Für einen manuellen, aber technisch unterstützten Transport können Handhubwagen oder zugelassene Maschinentransportfahrwerke dienen, wenn Last, Schwerpunkt und Untergrund dazu passen. Eine schwere Werkzeugmaschine wird nicht durch bloße Muskelkraft sicher transportierbar."},{"label":"Kranführen in Österreich","text":"Erforderlich sind geeignete, entsprechend unterwiesene Personen und eine ausdrückliche Fahrbewilligung des Arbeitgebers; für bestimmte Krane zusätzlich der passende Fachkenntnisnachweis. Die vereinfachte Angabe „über 5 t“ ersetzt nicht die Rechtsprüfung: § 3 FK-V nennt unter anderem flurgesteuerte Krane bis 50 kN als Ausnahme; bei Fahrzeug-/Ladekranen sind auch 100 kNm Lastmoment und die genaue Bauart relevant. 50 kN entsprechen ungefähr 5 t. Für große Krane gelten die entsprechenden Nachweise; Minderjährigenschutz ist zusätzlich zu beachten."},{"label":"Zwei Anschlagmittel","text":"Anschlagketten und geeignete Rundschlingen beziehungsweise Hebebänder verbinden Lastaufnahmemittel und Last. Tragfähigkeit, Anschlagart, Winkel, Kantenschutz und Herstellerfreigaben müssen zur Last passen. Beschädigte oder nicht eindeutig gekennzeichnete Mittel ausscheiden."},{"label":"Transport vorbereiten","text":"Masse, Schwerpunkt und freigegebene Anschlagpunkte aus der Dokumentation ermitteln; Transportweg, Boden-/Deckentragfähigkeit und Durchfahrten prüfen. Versorgung fachgerecht trennen, Restenergien sichern, bewegliche Teile und Werkzeug festsetzen und empfindliche Baugruppen schützen. Ein geeigneter Transportplan legt Mittel, Lastsicherung, Zuständigkeiten, Absperrung und Kommunikation fest."}],"mnemonic":"Masse und Schwerpunkt kennen, Mittel prüfen, Personen berechtigen.","pitfall":"Eine deutsche Kranregel als österreichische Antwort verwenden oder die 5-t-Angabe ohne Kranart und Lastmoment auslegen.","imagePage":null,"pdfPage":58},{"id":"E40","title":"Schrittketten und Bussysteme","category":"Automation","question":"Erklären Sie Schritt und Transition an einem einfachen Ablauf, nennen Sie zwei Vorteile von GRAPH/SFC und beschreiben Sie, welche Aufgaben das Kommunikationssystem in der Anlage übernimmt.","answer":[{"label":"Schritt","text":"Ein Schritt beschreibt einen Zustand des Ablaufs. Solange er aktiv ist, werden die ihm zugeordneten Aktionen nach ihren Bedingungen und Qualifizierungen bearbeitet. Beispiel: Im Schritt „Spannen“ wird das Werkstück eingespannt und die Rückmeldung überwacht."},{"label":"Transition","text":"Eine Transition ist die logische Weiterschaltbedingung zwischen Schritten. Ist der Vorgängerschritt aktiv und die Bedingung erfüllt, kann in den Folgeschritt gewechselt werden. Beispiel: Erst wenn die zulässige Spannrückmeldung vorliegt, folgt „Bearbeiten“. Eine Transition ist keine Aktion."},{"label":"Zwei Vorteile","text":"Der Prozessablauf ist grafisch leichter mit dem tatsächlichen Maschinenablauf zu vergleichen. Zusätzlich lassen sich aktive Schritte, fehlende Bedingungen und Zeitüberschreitungen gezielt diagnostizieren. Parallele oder alternative Abläufe können klar modelliert werden."},{"label":"Busaufgaben","text":"Bussysteme verbinden SPS, dezentrale Ein-/Ausgänge, Antriebe und Bediengeräte. Sie übertragen zyklische Prozesswerte, azyklische Parameter und Diagnosen, reduzieren Einzelverdrahtung und ermöglichen abgestimmte Abläufe. Zeitverhalten und Ausfallreaktion müssen zur Anwendung passen. Sicherheitskommunikation benötigt dafür ausgelegte Protokolle und Komponenten; ein Standardbus ist allein keine Sicherheitsfunktion."}],"mnemonic":"Der Schritt handelt, die Transition erlaubt den Wechsel.","pitfall":"Eine Transition aktiv erzwingen, obwohl die physische Anlage die Weiterschaltbedingung noch nicht erfüllt.","imagePage":null,"pdfPage":61}];

const btn=(label,cls='primary',act='',extra='')=>`<button type="button" class="btn ${cls}" ${act?`data-go="${act}"`:''} ${extra}>${label}</button>`;
const leds=s=>`<span class="leds" aria-label="Stufe ${s} von 5: ${STAGES[s]}">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}" style="--c:${STAGE_COLORS[s]}"></i>`).join('')}</span>`;
function ring(pct,label,size=96,color='var(--flow)'){const r=40,len=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 100 100" style="width:${size}px;height:${size}px"><circle class="bg" cx="50" cy="50" r="${r}"/><circle class="fg" cx="50" cy="50" r="${r}" stroke="${color}" stroke-dasharray="${len}" stroke-dashoffset="${len*(1-pct/100)}" style="--len:${len}"/><text x="50" y="52" text-anchor="middle" font-size="22">${pct}%</text><text x="50" y="68" text-anchor="middle" font-size="8.5" fill="currentColor" style="fill:var(--ink-3);font-family:var(--ui);letter-spacing:.08em">${label}</text></svg>`}
function gauge(val,max,label,sub){const a=-120+240*(val/max);let ticks='';for(let i=0;i<=20;i++){const ang=(-120+i*12)*Math.PI/180,r1=i%5?66:62,r2=72;ticks+=`<line x1="${85+r1*Math.sin(ang)}" y1="${92-r1*Math.cos(ang)}" x2="${85+r2*Math.sin(ang)}" y2="${92-r2*Math.cos(ang)}" stroke="${i/20<=val/max?'var(--signal)':'var(--ink-3)'}" stroke-width="${i%5?1.4:2.2}" stroke-linecap="round" opacity="${i/20<=val/max?1:.45}"/>`}
 return `<div class="gauge-wrap"><svg class="gauge" viewBox="0 0 170 118" role="img" aria-label="${label}: ${val} von ${max}">${ticks}<g class="needle" style="transform:rotate(${a}deg)"><path d="M85 92 L85 34" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="85" cy="92" r="6.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.4"/><text x="85" y="116" text-anchor="middle" font-size="20" font-weight="700" style="font-family:var(--display)" class="num">${val}<tspan font-size="13" font-weight="500" style="fill:var(--ink-3)"> / ${max}</tspan></text></svg><b class="small">${label}</b><span class="small faint">${sub}</span></div>`}
const catGlyph=c=>`<span class="cat-glyph" title="${c}">${ic(c)}</span>`;
function head(title,sub,actions=''){
 if(st.plat==='win')return `<div class="head"><div><h1 class="big-title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${actions}</div>`;
 return `<div class="head"><h1 class="big-title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}

/* ---------------- Bildschirme ---------------- */
function vToday(){
