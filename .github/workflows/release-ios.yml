name: iPhone SideStore release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Shared build and tests
        run: pnpm run build && pnpm test
      - name: Generate iOS project with Keychain bridge
        run: pnpm run ios:sync
      - name: Archive without an Apple signing identity
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild archive -project ios/native/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qry "Lernpass-$VERSION.ipa" Payload
      - name: Publish IPA and update SideStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs > build/release-notes.txt
          gh release view "v$VERSION" || gh release create "v$VERSION" --title "Lernpass v$VERSION" --notes-file build/release-notes.txt
          gh release upload "v$VERSION" "build/Lernpass-$VERSION.ipa" --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          RELEASE_VERSION="$VERSION" node scripts/sidestore-source.mjs "build/Lernpass-$VERSION.ipa"
          git add sidestore/source.json
          git commit -m "Update SideStore source for v$VERSION" || true
          git push origin main
